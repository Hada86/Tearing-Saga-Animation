<svg xmlns="http://www.w3.org/2000/svg" height="720" width="960">
	<style>
		text:hover {
		opacity: 1;
		}
	</style>
	<defs>
		<image id="amap" href="Tearing Saga/G/AMAP.png"/>
		<g id="pointmap">
			<circle r="3" stroke="#FFFFFFFF" fill="#00FF00FF"/>
