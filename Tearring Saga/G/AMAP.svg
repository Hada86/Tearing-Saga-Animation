	<use  x="420" y="625" href="#pointmap"/>
	<text x="420" y="625" text-anchor="middle" fill="white" opacity="0">Động Doras</text>
	<use  x="345" y="560" href="#pointmap"/>
	<text x="345" y="560" text-anchor="middle" fill="white" opacity="0">Thành Gram</text>
	<use  x="300" y="625" href="#pointmap"/>
	<text x="300" y="625" text-anchor="middle" fill="white" opacity="0">Cung Welt</text>
	<use  x="290" y="575" href="#pointmap"/>
	<text x="290" y="575" text-anchor="middle" fill="white" opacity="0">Làng Lot</text>
	<use  x="325" y="535" href="#pointmap"/>
	<text x="325" y="535" text-anchor="middle" fill="white" opacity="0">Đền Mars</text>
	<use  x="235" y="550" href="#pointmap"/>
	<text x="235" y="550" text-anchor="middle" fill="white" opacity="0">Cảng Mars</text>
	<use  x="235" y="550" href="#pointmap"/>
	<text x="235" y="550" text-anchor="middle" fill="white" opacity="0">Cảng Mars</text>
</svg>
