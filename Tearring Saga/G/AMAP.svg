            attributeName="opacity" 
            values="1;1;0;0"
			dur="3s"
			repeatCount="indefinite" 
			keyTimes="0; .5;.8; 1"/>
		</g>
	</defs>
	<use href="#amap"/>	
	<use  x="390" y="520" href="#pointmap"/>
	<text x="390" y="520" text-anchor="middle" fill="white" opacity="0">Cảng Sora</text>
	<use  x="435" y="585" href="#pointmap"/>
